meta:
  standard: "ISO/IEC 42001:2023"
  title: "AI Management System Audit Controls"
  version: "1.0"
  scope: "Internal AI systems and data processing pipelines"

sections:
  - clause: "4"
    title: "Context of the organization"
    controls:
      - id: "4.1"
        title: "Understanding the organization and its context"
        ref: "ISO/IEC 42001:2023, cl. 4.1"
        checks:
          - text: "Internal and external issues relevant to AI development/deployment are identified and documented"
            evidence_hint: "Context analysis document or strategic AI plan"
          - text: "Issues are reviewed at planned intervals (at least annually)"
            evidence_hint: "Review log, meeting minutes, or management review records"
          - text: "Relevant parties (regulators, customers, staff) are listed with their AI-related expectations"
            evidence_hint: "Stakeholder register"
      - id: "4.2"
        title: "Understanding the needs and expectations of interested parties"
        ref: "ISO/IEC 42001:2023, cl. 4.2"
        checks:
          - text: "Interested parties relevant to the AI management system are identified"
            evidence_hint: "Stakeholder register with contact owners"
          - text: "Requirements of each interested party are documented and assigned an owner"
            evidence_hint: "Requirements register or AIMS policy appendix"
          - text: "Legal, regulatory, and contractual obligations for AI systems are captured"
            evidence_hint: "Compliance obligations register"
      - id: "4.3"
        title: "Determining the scope of the AI management system"
        ref: "ISO/IEC 42001:2023, cl. 4.3"
        checks:
          - text: "The scope statement is documented and includes in-scope AI systems/use cases"
            evidence_hint: "Scope document or AIMS manual section 1"
          - text: "Exclusions are justified with rationale"
            evidence_hint: "Scope document, exclusion rationale section"
          - text: "Scope is reviewed when new AI systems are introduced or retired"
            evidence_hint: "Change log or scope review record"

  - clause: "5"
    title: "Leadership"
    controls:
      - id: "5.1"
        title: "Leadership and commitment"
        ref: "ISO/IEC 42001:2023, cl. 5.1"
        checks:
          - text: "Top management has approved and signed the AI policy"
            evidence_hint: "Signed AI policy document with date"
          - text: "Roles, responsibilities, and authorities for AI governance are assigned and communicated"
            evidence_hint: "RACI matrix or org chart with AI roles"
          - text: "Resources (budget, staff, tooling) are allocated for the AIMS"
            evidence_hint: "Budget approval records or resource plan"
          - text: "Top management participates in at least one management review per year"
            evidence_hint: "Management review minutes with attendee list"
      - id: "5.2"
        title: "AI policy"
        ref: "ISO/IEC 42001:2023, cl. 5.2"
        checks:
          - text: "AI policy includes commitment to responsible, ethical AI development"
            evidence_hint: "AI policy, objectives section"
          - text: "Policy is available to all relevant internal and external parties"
            evidence_hint: "Intranet/website link or distribution record"
          - text: "Policy is reviewed for continued suitability at least annually"
            evidence_hint: "Policy revision history"

  - clause: "6"
    title: "Planning"
    controls:
      - id: "6.1"
        title: "Actions to address risks and opportunities"
        ref: "ISO/IEC 42001:2023, cl. 6.1"
        checks:
          - text: "AI risk assessment methodology is documented and includes likelihood and impact criteria"
            evidence_hint: "Risk methodology document"
          - text: "Risk register covers AI-specific risks (bias, safety, security, privacy, explainability)"
            evidence_hint: "AI risk register"
          - text: "Risk treatment plans are created for accepted risks above the risk appetite threshold"
            evidence_hint: "Risk treatment plan or remediation tracker"
          - text: "Residual risks are formally accepted by an appropriate owner"
            evidence_hint: "Risk acceptance records"
      - id: "6.2"
        title: "AI objectives and planning to achieve them"
        ref: "ISO/IEC 42001:2023, cl. 6.2"
        checks:
          - text: "AI objectives are measurable and aligned with the AI policy"
            evidence_hint: "Objectives register or OKR tracker"
          - text: "Each objective has an owner, target date, and measurement method"
            evidence_hint: "Objectives register"
          - text: "Progress against objectives is monitored and reported to top management"
            evidence_hint: "Dashboard or periodic report"

  - clause: "7"
    title: "Support"
    controls:
      - id: "7.1"
        title: "Resources"
        ref: "ISO/IEC 42001:2023, cl. 7.1"
        checks:
          - text: "Sufficient human resources with AI competencies are available for AIMS operation"
            evidence_hint: "Headcount plan or staffing review"
          - text: "Infrastructure supporting AI development and deployment is documented"
            evidence_hint: "Infrastructure register or architecture diagram"
      - id: "7.2"
        title: "Competence"
        ref: "ISO/IEC 42001:2023, cl. 7.2"
        checks:
          - text: "Required competencies for each AI-related role are defined"
            evidence_hint: "Job descriptions or competency framework"
          - text: "Gaps between required and actual competencies are identified and addressed"
            evidence_hint: "Training needs analysis or skills gap log"
          - text: "Evidence of training completion is retained"
            evidence_hint: "Training completion certificates or LMS records"
      - id: "7.4"
        title: "Communication"
        ref: "ISO/IEC 42001:2023, cl. 7.4"
        checks:
          - text: "Internal communication channels for AI-related issues are defined"
            evidence_hint: "Communication plan or escalation procedure"
          - text: "External communication approach for AI incidents is documented"
            evidence_hint: "Incident communication procedure"
      - id: "7.5"
        title: "Documented information"
        ref: "ISO/IEC 42001:2023, cl. 7.5"
        checks:
          - text: "Required AIMS documents are identified and controlled"
            evidence_hint: "Document control procedure"
          - text: "Documents are reviewed, approved, and protected from unauthorised changes"
            evidence_hint: "Document approval history or DMS settings"
          - text: "Retention and disposal periods for AIMS records are defined"
            evidence_hint: "Retention schedule"

  - clause: "8"
    title: "Operation"
    controls:
      - id: "8.1"
        title: "Operational planning and control"
        ref: "ISO/IEC 42001:2023, cl. 8.1"
        checks:
          - text: "Criteria and processes for AI system development/deployment are defined"
            evidence_hint: "AI development lifecycle policy or playbook"
          - text: "Externally provided AI systems or services are assessed before use"
            evidence_hint: "Third-party AI assessment records or vendor questionnaire"
      - id: "8.4"
        title: "AI system impact assessment"
        ref: "ISO/IEC 42001:2023, cl. 8.4"
        checks:
          - text: "Impact assessments are conducted before deploying AI systems"
            evidence_hint: "AI impact assessment reports"
          - text: "Assessments cover potential harms to individuals and groups (bias, safety)"
            evidence_hint: "Impact assessment template with harm categories"
          - text: "Results are reviewed by an independent party or ethics board"
            evidence_hint: "Review sign-off in impact assessment document"
      - id: "8.5"
        title: "Addressing AI risks across the AI lifecycle"
        ref: "ISO/IEC 42001:2023, cl. 8.5"
        checks:
          - text: "Risk controls are applied at each AI lifecycle phase (design, train, deploy, retire)"
            evidence_hint: "Lifecycle control checklist or MLOps runbook"
          - text: "Data quality checks are performed and documented before training"
            evidence_hint: "Data quality report or data card"
          - text: "Model performance metrics are monitored in production with alerting thresholds"
            evidence_hint: "Monitoring dashboard or SLA document"

  - clause: "9"
    title: "Performance evaluation"
    controls:
      - id: "9.1"
        title: "Monitoring, measurement, analysis, and evaluation"
        ref: "ISO/IEC 42001:2023, cl. 9.1"
        checks:
          - text: "Key performance indicators for AI systems and the AIMS are defined"
            evidence_hint: "KPI register or metrics catalogue"
          - text: "Monitoring results are analysed and trended over time"
            evidence_hint: "Monthly/quarterly metrics reports"
          - text: "Anomalies trigger investigation and corrective action"
            evidence_hint: "Incident or deviation log"
      - id: "9.2"
        title: "Internal audit"
        ref: "ISO/IEC 42001:2023, cl. 9.2"
        checks:
          - text: "An internal audit programme covering all AIMS clauses is in place"
            evidence_hint: "Audit programme document"
          - text: "Auditors are independent from the areas being audited"
            evidence_hint: "Audit plan showing auditor assignment"
          - text: "Audit findings are reported to management and tracked to closure"
            evidence_hint: "Audit reports and finding tracker"
      - id: "9.3"
        title: "Management review"
        ref: "ISO/IEC 42001:2023, cl. 9.3"
        checks:
          - text: "Management reviews are held at planned intervals (at least annually)"
            evidence_hint: "Management review minutes with dates"
          - text: "Review agenda includes: audit results, KPIs, risks, policy suitability"
            evidence_hint: "Management review agenda template"
          - text: "Outputs (decisions, actions) are documented and followed up"
            evidence_hint: "Action log from management review"

  - clause: "10"
    title: "Improvement"
    controls:
      - id: "10.1"
        title: "Continual improvement"
        ref: "ISO/IEC 42001:2023, cl. 10.1"
        checks:
          - text: "A process for identifying and implementing continual improvements is defined"
            evidence_hint: "Improvement procedure or Kaizen log"
          - text: "Improvement opportunities are logged and prioritised"
            evidence_hint: "Improvement register"
      - id: "10.2"
        title: "Nonconformity and corrective action"
        ref: "ISO/IEC 42001:2023, cl. 10.2"
        checks:
          - text: "Nonconformities are recorded with root cause analysis"
            evidence_hint: "NCR log with root cause fields"
          - text: "Corrective actions are implemented and their effectiveness verified"
            evidence_hint: "Corrective action log with close-out evidence"
          - text: "Lessons learned are shared with relevant teams"
            evidence_hint: "Lessons-learned register or retrospective notes"
