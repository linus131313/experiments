version: "1.0"
description: >
  Structured taxonomy of observed agent failure modes in LLM-based agent systems.
  Each failure is categorised, severity-rated, and paired with observable signals
  and concrete mitigations.

categories:

  - id: goal-interpretation
    label: "Goal Interpretation"
    description: "Failures that occur before any tool is invoked - the agent misunderstands what it should achieve."
    failures:
      - id: goal-drift
        label: "Goal Drift"
        severity: high
        description: "Agent silently substitutes a related but different objective, often one that is easier to satisfy."
        signals:
          - "Output satisfies a literal reading but misses user intent"
          - "Agent reports success while key constraint is unmet"
        mitigations:
          - "Echo goal back to user for confirmation before acting"
          - "Evaluate output against original goal, not intermediate sub-goals"
        examples:
          - "Asked to 'summarise without losing key numbers', agent drops all figures"

      - id: ambiguity-collapse
        label: "Ambiguity Collapse"
        severity: medium
        description: "Agent picks one interpretation of an ambiguous instruction without surfacing alternatives."
        signals:
          - "Single response when multiple valid interpretations exist"
          - "No clarifying questions asked despite high-stakes ambiguity"
        mitigations:
          - "Detect high-uncertainty inputs and ask for disambiguation"
          - "Enumerate interpretations in the reply"
        examples:
          - "'Delete old files' interpreted as all files older than 1 day, not user-intended 30 days"

      - id: scope-creep
        label: "Scope Creep"
        severity: medium
        description: "Agent expands the task beyond what was requested, taking unsolicited side actions."
        signals:
          - "Agent modifies files, records, or state outside the stated scope"
          - "Latency or side-effects larger than the task warrants"
        mitigations:
          - "Declare explicit action scope before execution"
          - "Require confirmation before acting outside the stated boundary"
        examples:
          - "Asked to fix one bug, agent refactors the entire file"

  - id: planning
    label: "Planning"
    description: "Failures in decomposing a goal into a valid, executable sequence of steps."
    failures:
      - id: missing-precondition
        label: "Missing Precondition"
        severity: high
        description: "Plan assumes a resource or state exists that has not been established."
        signals:
          - "ToolNotFound or FileNotFound errors mid-execution"
          - "Agent references output of a step it never executed"
        mitigations:
          - "Validate preconditions before emitting each plan step"
          - "Topologically sort steps to surface ordering errors"
        examples:
          - "Agent tries to read a file it was supposed to create in an earlier skipped step"

      - id: circular-plan
        label: "Circular Plan"
        severity: high
        description: "Plan contains a dependency cycle, causing the agent to loop indefinitely."
        signals:
          - "Same tool called with identical arguments more than N times"
          - "No progress toward termination condition"
        mitigations:
          - "Maintain a seen-state set and halt on revisit"
          - "Cap total step count with a hard budget"
        examples:
          - "Agent alternates between two search queries hoping one will yield a different result"

      - id: over-decomposition
        label: "Over-Decomposition"
        severity: low
        description: "Task is split into far more steps than necessary, inflating cost and latency."
        signals:
          - "Step count disproportionately high relative to task complexity"
          - "Many trivial tool calls with no information gain"
        mitigations:
          - "Encourage single-step solutions for small tasks"
          - "Track cumulative tool cost and warn when it exceeds a threshold"
        examples:
          - "Fetching a single integer from a JSON file triggers five read and parse steps"

  - id: tool-use
    label: "Tool Use"
    description: "Failures in calling tools: hallucinated calls, wrong arguments, or mishandled results."
    failures:
      - id: hallucinated-tool-call
        label: "Hallucinated Tool Call"
        severity: critical
        description: "Agent invokes a tool that does not exist in the current tool set."
        signals:
          - "ToolNotFound errors in execution logs"
          - "Agent describes using a tool that was never defined"
        mitigations:
          - "Validate tool names against the live registry before execution"
          - "Inject tool list into prompt and instruct agent to stay within it"
        examples:
          - "Agent calls web_search when only file_read is available"

      - id: argument-type-error
        label: "Argument Type Error"
        severity: high
        description: "Agent passes wrong types or malformed values to a tool, causing silent failure or exceptions."
        signals:
          - "ValidationError or type-casting exceptions in tool wrappers"
          - "Tool returns unexpected empty result with no error surface"
        mitigations:
          - "Enforce JSON Schema validation at the tool boundary"
          - "Return structured errors that the agent can reason about"
        examples:
          - "Agent passes a list where a string path is expected"

      - id: ignored-tool-output
        label: "Ignored Tool Output"
        severity: high
        description: "Agent proceeds without incorporating a tool's return value, making later steps inconsistent."
        signals:
          - "Agent references a value that contradicts the tool result"
          - "Tool called but its output never appears in subsequent reasoning"
        mitigations:
          - "Require explicit acknowledgement of tool output before next step"
          - "Scan transcript for unread tool results before final answer"
        examples:
          - "Search returns 0 results; agent continues as if results were found"

      - id: tool-result-fabrication
        label: "Tool Result Fabrication"
        severity: critical
        description: "Agent invents tool output instead of waiting for the real result."
        signals:
          - "Answer references specific data that was never returned by any tool call"
          - "Discrepancy between execution log and cited values"
        mitigations:
          - "Architecturally separate tool execution from generation; never let the model inline results"
          - "Ground-truth check: re-fetch critical values from tools before committing"
        examples:
          - "Agent cites a file line number without having called the read tool"

  - id: context-management
    label: "Context Management"
    description: "Failures related to maintaining accurate state across a multi-step interaction."
    failures:
      - id: context-overflow-truncation
        label: "Context Overflow Truncation"
        severity: high
        description: "Earlier tool results or instructions are silently dropped when the context window fills."
        signals:
          - "Agent repeats an action it already completed"
          - "Agent ignores a constraint stated early in the conversation"
        mitigations:
          - "Summarise completed steps into a compact state block"
          - "Prioritise retaining constraints over intermediate tool outputs"
        examples:
          - "Agent forgets the user said 'do not delete backups' after 40 tool calls"

      - id: stale-state-reference
        label: "Stale State Reference"
        severity: medium
        description: "Agent reasons about a value that has changed since it was last fetched."
        signals:
          - "Agent uses a cached value after an action that would invalidate it"
          - "Re-fetch would return a different result"
        mitigations:
          - "Timestamp all fetched values; re-fetch if age exceeds a threshold"
          - "Invalidate derived values when their dependencies change"
        examples:
          - "Agent reads a file, modifies it, then reads a downstream value computed from the original"

      - id: contradictory-belief
        label: "Contradictory Belief"
        severity: high
        description: "Agent holds two mutually exclusive beliefs simultaneously and acts on both."
        signals:
          - "Agent states a fact and its negation in consecutive steps"
          - "Decision logic branches on a condition already ruled out"
        mitigations:
          - "Maintain a belief ledger; flag contradictions before acting"
          - "Force explicit resolution when a new tool result conflicts with a prior belief"
        examples:
          - "Agent concludes file exists and does not exist based on two different searches"

  - id: execution
    label: "Execution"
    description: "Failures during the actual execution of planned actions."
    failures:
      - id: retry-storm
        label: "Retry Storm"
        severity: high
        description: "Agent retries a failing call indefinitely without backoff or escalation."
        signals:
          - "Same call repeated more than 3 times with the same error"
          - "Total tool cost growing without progress"
        mitigations:
          - "Implement exponential backoff with a hard cap"
          - "Surface persistent errors to the user rather than silently retrying"
        examples:
          - "Network error on API call triggers 20 immediate retries"

      - id: partial-completion
        label: "Partial Completion"
        severity: high
        description: "Agent stops mid-task after an error, leaving the system in an inconsistent state."
        signals:
          - "Some files written but not others in a multi-file operation"
          - "Agent reports success despite an uncaught exception midway"
        mitigations:
          - "Use transactional patterns: stage changes, commit atomically, roll back on error"
          - "Maintain a completion checklist and verify each item before reporting done"
        examples:
          - "Three of five config files updated; agent exits on the fourth due to permission error"

      - id: unintended-side-effect
        label: "Unintended Side Effect"
        severity: critical
        description: "Agent modifies state outside the intended scope as a byproduct of a valid action."
        signals:
          - "Downstream systems affected by an action on an upstream resource"
          - "User reports unexpected changes in unrelated areas"
        mitigations:
          - "Enumerate all write-paths before execution and confirm with the user"
          - "Use dry-run or staging modes where available"
        examples:
          - "Deleting a shared config key removes settings for all users, not just the target"

  - id: self-assessment
    label: "Self-Assessment"
    description: "Failures in the agent's ability to evaluate its own outputs and uncertainty."
    failures:
      - id: overconfidence
        label: "Overconfidence"
        severity: high
        description: "Agent reports high certainty on an output that is wrong or poorly grounded."
        signals:
          - "Definitive language ('definitely', 'I confirmed') without supporting evidence"
          - "No uncertainty quantification on inherently ambiguous outputs"
        mitigations:
          - "Require citations for factual claims"
          - "Calibrate confidence by comparing claim to retrieved evidence"
        examples:
          - "Agent says 'the database has 10,000 rows' without querying it"

      - id: failure-denial
        label: "Failure Denial"
        severity: high
        description: "Agent reports success after a detectable failure rather than surfacing the error."
        signals:
          - "Success message immediately after an exception in the execution log"
          - "Output missing required components but reported as complete"
        mitigations:
          - "Parse tool error codes and surface them explicitly"
          - "Validate output against a success criterion before reporting done"
        examples:
          - "File write fails silently; agent responds 'file saved successfully'"

      - id: poor-termination
        label: "Poor Termination"
        severity: medium
        description: "Agent fails to recognise when the task is complete and continues generating unnecessary steps."
        signals:
          - "Goal already satisfied but agent continues acting"
          - "Redundant verification steps after a confirmed success"
        mitigations:
          - "Define an explicit termination condition before execution"
          - "Check goal-satisfaction after each step; halt when met"
        examples:
          - "File successfully written and verified; agent continues to re-read it three more times"
